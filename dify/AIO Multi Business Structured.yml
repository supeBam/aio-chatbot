    - data:
        code_language: python3
        outputs:
          bundle:
            children:
              current_business:
                type: string
                children: null
              bn_scope_codes:
                type: array[string]
                children: null
              routing_context:
                type: object
                children: null
              bn_plans_tags:
                type: array[object]
                children: null
              bn_catalog_status:
                type: string
                children: null
              bn_needs:
                type: object
                children: null
              ms_plans_tags:
                type: array[object]
                children: null
              ms_catalog_status:
                type: string
                children: null
              ms_needs:
                type: object
                children: null
              xe_plans_tags:
                type: array[object]
