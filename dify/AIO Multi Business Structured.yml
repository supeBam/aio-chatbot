                type: string
                children: null
            type: object
        selected: false
        title: 按条校验并保存需求，交由产品分析决策
        type: code
        variables:
        - value_selector:
          - extract_retry_loop
          - current_text
          value_type: string
          variable: llm_output
        - value_selector:
          - catalog
          - snapshot
          value_type: object
          variable: snapshot
        - value_selector:
