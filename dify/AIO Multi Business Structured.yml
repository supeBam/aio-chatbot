            children: null
            type: string
        selected: false
        title: 校验套餐、需求覆盖及原文引用
        type: code
        variables:
        - value_selector:
          - select_retry_loop
          - current_text
          value_type: string
          variable: llm_output
        - value_selector:
          - rank
