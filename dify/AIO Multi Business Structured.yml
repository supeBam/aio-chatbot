                      result.update(mode="boundary", text="簡短帶回電訊計劃選購，不處理無關問題。")
                      return result
                  if question.strip() or not business:
                      pending = snapshot["routing_context"]["messages"]
                      if len(pending) >= 20:
                          raise ValueError("待澄清消息过多")
