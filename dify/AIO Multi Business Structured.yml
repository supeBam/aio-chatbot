          OPERATOR_PATTERN = re.compile(
              r"中国移动(?:香港)?|中國移動(?:香港)?|中国联通|中國聯通|中国电信|中國電信|"
              r"3[ ]*香港|3[ ]*Hong[ ]*Kong|和记电讯|和記電訊|"
              r"香港宽频|香港寬頻|香港电讯|香港電訊|电讯盈科|電訊盈科|数码通|數碼通|"
