    - data:
        context:
          enabled: false
          variable_selector: []
        default_value:
        - key: text
          type: string
          value: 暫時未搵到完全符合條件嘅產品，你可以放寬其中一個條件，我再幫你重新篩選。
        error_strategy: default-value
        model:
          completion_params:
            max_tokens: 180
            temperature: 0.25
            thinking: false
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: 3500000000101-system
          role: system
          text: '你是 HKBN 销售顾问。当前候选产品已经全部被资格判断过滤，不能推荐任何被过滤产品。


            任务：根据用户问题、多轮上下文、active_constraints_json 和 filtered_debug，解释为什么暂时没有合适产品，并引导用户放宽一个条件。


            硬规则：

            - 不得推荐 filtered_debug 中被过滤的产品。

            - 不得编造新产品、价格、优惠、链接、product_id 或 plan_code。

            - 如果是 REFINE_SEARCH / cheaper_alternative，必须继承上一轮核心需求，不要把「更便宜」理解成任意更便宜产品都可推荐。

            - 如果 hard constraint 没有候选满足，要明确说明缺口。

            - 回复要自然、简洁、有顾问感，可用 1 个 emoji。

            - 不输出 JSON，不输出内部字段，不输出机器标记，不输出候选编号。

            - 最后只问一个放宽条件的问题。


            【地点真实性】不得说“已帮你查某地区”“某地区最低价”或把用户自述地点当成已核实地址。只能说“当前候选中暂未见符合条件的产品”；Callback/AS_COVERAGE只可说“本次地址覆盖结果内”。'
        - id: 3500000000101-user
          role: user
          text: '【用户问题】

            {{#sys.query#}}


            【分支】

            CALLBACK_NO_VALID_PRODUCT


            【Callback 路由/上下文】

            service_type={{#3200000000004.service_type#}}

            answer_mode={{#3200000000004.answer_mode#}}

            coverage_status={{#3200000000004.coverage_status#}}

            coverage_instruction={{#3200000000004.coverage_reply_instruction#}}

