    - data:
        code: "import re\n\ndef split_codes(text):\n    raw = str(text or \"\").strip()\n\
          \    if not raw:\n        return []\n    items = []\n    seen = set()\n\
          \    for x in re.split(r\"[,，;；\\s\\n]+\", raw):\n        v = x.strip()\n\
          \        if v and v not in seen:\n            items.append(v)\n        \
          \    seen.add(v)\n    return items\n\ndef join_codes_en_comma(codes):\n\
          \    # Dify metadata in works best with English comma-separated values.\n\
          \    return \",\".join([str(x).strip() for x in codes if str(x).strip()])\n\
          \ndef has_any(text, words):\n    t = str(text or \"\").lower()\n    return\
          \ any(str(w).lower() in t for w in words)\n\ndef callback_query(kind=\"\
          recommend\"):\n    # Query is only for pulling useful product detail fields\
          \ from the already metadata-filtered candidates.\n    base = (\n       \
          \ \"方案名称 套餐参考月费 合约月数 合约期 服务内容 宽频速度 \"\n        \"价格信息 优惠政策 功能信息 家居宽频\"\n\
          \    )\n    if kind == \"hit\":\n        return base + \" 已推荐宽频方案详情\"\n\
          \    if kind == \"changed\":\n        return base + \" 更新地址覆盖结果 可安装宽频方案\"\
          \n    if kind == \"reset\":\n        return base + \" 覆盖范围内可安装宽频方案\"\n \
          \   return base + \" 可安装宽频方案\"\n\ndef main(user_query: str = \"\", effective_plan_code:\
          \ str = \"\", last_plan_code_bn: str = \"\", has_input_payload=False):\n\
          \    q = str(user_query or \"\").strip()\n    callback_words = [\n     \
          \   \"address_form_submitted\",\n        \"地址表单已提交\", \"地址表單已提交\",\n   \
          \     \"我已提交地址覆盖信息\", \"我已提交地址覆蓋信息\",\n        \"已提交地址覆盖信息\", \"已提交地址覆蓋信息\"\
          ,\n        \"地址覆盖信息已提交\", \"地址覆蓋信息已提交\",\n        \"已提交地址\", \"地址已经填好\"\
          , \"地址已經填好\",\n        \"地址覆盖已经提交\", \"地址覆蓋已經提交\",\n        \"表单已经填完\",\
          \ \"表單已經填完\",\n        \"已经填咗地址\", \"已經填咗地址\",\n        \"我填咗地址\", \"已经提交\"\
          , \"已經提交\",\n    ]\n    address_changed_words = [\n        \"我已更改地址信息\"\
          , \"我已更改地址資訊\", \"我已更改地址资料\", \"我已更改地址資料\",\n        \"已更改地址信息\", \"已更改地址資訊\"\
          , \"已更改地址资料\", \"已更改地址資料\",\n        \"地址已更新\", \"地址已更改\", \"更改地址完成\", \"\
          更新地址完成\",\n        \"address changed\", \"changed address\", \"new address\
          \ submitted\", \"updated address\",\n    ]\n\n    plan_codes = split_codes(effective_plan_code)\n\
          \    plan_filter = join_codes_en_comma(plan_codes)\n    last_bn = str(last_plan_code_bn\
          \ or \"\").strip()\n\n    is_address_changed = bool(plan_codes) and bool(has_input_payload)\
          \ and has_any(q, address_changed_words)\n    is_normal_callback = bool(plan_codes)\
          \ and has_any(q, callback_words)\n    is_callback = is_address_changed or\
          \ is_normal_callback\n\n    if not is_callback:\n        return {\n    \
          \        \"is_coverage_callback\": False,\n            \"is_address_changed\"\
          : False,\n            \"address_change_type\": \"NONE\",\n            \"\
          coverage_status\": \"NONE\",\n            \"filter_product_ids\": \"\",\n\
          \            \"retrieval_query\": \"\",\n            \"answer_mode\": \"\
          NORMAL_SEARCH\",\n            \"service_type\": \"\",\n            \"coverage_mode\"\
          : \"NONE\",\n            \"coverage_reply_instruction\": \"\",\n       \
          \ }\n\n    change_prefix = \"已收到你重新提交嘅地址覆蓋結果。\" if is_address_changed else\
          \ \"已收到地址覆蓋結果。\"\n    address_change_type = \"FRONTEND_ADDRESS_CHANGED\"\
          \ if is_address_changed else \"NORMAL_ADDRESS_SUBMIT\"\n\n    if not last_bn:\n\
          \        return {\n            \"is_coverage_callback\": True,\n       \
          \     \"is_address_changed\": is_address_changed,\n            \"address_change_type\"\
          : address_change_type,\n            \"coverage_status\": \"NO_PREVIOUS_BN\"\
          ,\n            \"filter_product_ids\": plan_filter,\n            \"retrieval_query\"\
          : callback_query(\"changed\" if is_address_changed else \"recommend\"),\n\
          \            \"answer_mode\": \"AS_COVERAGE_RECOMMEND\",\n            \"\
          service_type\": \"AS\",\n            \"coverage_mode\": \"AS_COVERAGE\"\
          ,\n            \"coverage_reply_instruction\": change_prefix + \"由於之前未有可對應的寬頻推薦紀錄，請直接根據今次可安裝方案推薦一個合適寬頻計劃；不要要求再次填地址表單，不要輸出\
          \ BN 彈窗標記。\",\n        }\n\n    if last_bn in plan_codes:\n        return\
          \ {\n            \"is_coverage_callback\": True,\n            \"is_address_changed\"\
          : is_address_changed,\n            \"address_change_type\": address_change_type,\n\
          \            \"coverage_status\": \"HIT_PREVIOUS_BN\",\n            \"filter_product_ids\"\
          : last_bn,\n            \"retrieval_query\": callback_query(\"hit\"),\n\
          \            \"answer_mode\": \"AS_COVERAGE_HIT\",\n            \"service_type\"\
          : \"AS\",\n            \"coverage_mode\": \"AS_COVERAGE\",\n           \
          \ \"coverage_reply_instruction\": change_prefix + \"剛才推薦的寬頻方案在今次地址覆蓋範圍內，可以繼續考慮；請基於候選產品補充月費、合約、速度/服務內容及注意事項；不要要求再次填地址表單，不要輸出\
          \ BN 彈窗標記。\",\n        }\n\n    return {\n        \"is_coverage_callback\"\
          : True,\n        \"is_address_changed\": is_address_changed,\n        \"\
          address_change_type\": address_change_type,\n        \"coverage_status\"\
          : \"MISS_PREVIOUS_BN\",\n        \"filter_product_ids\": plan_filter,\n\
          \        \"retrieval_query\": callback_query(\"changed\" if is_address_changed\
          \ else \"reset\"),\n        \"answer_mode\": \"AS_COVERAGE_RECOMMEND\",\n\
          \        \"service_type\": \"AS\",\n        \"coverage_mode\": \"AS_COVERAGE\"\
          ,\n        \"coverage_reply_instruction\": change_prefix + \"不過剛才推薦的寬頻方案未能在今次地址覆蓋結果內使用；請明確說明會改為根據更新後地址覆蓋結果推薦以下可安裝方案；不要要求再次填地址表單，不要輸出\
          \ BN 彈窗標記。\",\n    }\n"
