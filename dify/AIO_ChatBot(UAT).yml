        code: "import json, re, html\n\ndef safe(x): return \"\" if x is None else\
          \ str(x)\n\ndef to_obj(raw):\n    if isinstance(raw, dict): return raw\n\
          \    try:\n        x=json.loads(safe(raw)); return x if isinstance(x,dict)\
          \ else {}\n    except Exception: return {}\n\ndef num(v):\n    if isinstance(v,(int,float)):\
          \ return float(v)\n    m=re.search(r'\\d+(?:\\.\\d+)?', safe(v).replace(',',''))\n\
          \    return float(m.group(0)) if m else None\n\ndef op(v): return html.unescape(safe(v)).strip()\n\
          \ndef main(service_type: str='', active_constraints_json: str='', effective_query:\
          \ str=''):\n    st=safe(service_type).strip().upper()\n    obj=to_obj(active_constraints_json)\n\
          \    cs=obj.get('constraints',[]) if isinstance(obj.get('constraints',[]),list)\
          \ else []\n    budget_max=None; speed_min=None; data_min=None; contract_max=None\n\
          \    for c in cs:\n        if not isinstance(c,dict) or safe(c.get('priority')).lower()!='hard':\
          \ continue\n        slot=safe(c.get('slot')).lower()\n        oper=op(c.get('operator')\
          \ or 'is')\n        v=c.get('normalized_value') if c.get('normalized_value')\
          \ not in (None,'') else c.get('value')\n        n=num(v)\n        if n is\
          \ None: continue\n        raw=(safe(v)+' '+safe(c.get('unit'))).lower()\n\
          \        if slot in ('price','monthly_fee','budget') and oper in ('<','<=','≤','is','='):\n\
          \            budget_max=n\n        elif slot in ('speed','broadband_speed','bandwidth')\
          \ and oper in ('>','>=','≥','is','='):\n            if n<=10 and ('g' in\
          \ raw or 'gbps' in raw): n*=1000\n            speed_min=n\n        elif\
          \ slot in ('data_allowance','mobile_data','local_data','data') and oper\
          \ in ('>','>=','≥','is','='):\n            data_min=n\n        elif slot\
          \ in ('contract','contract_month','duration') and oper in ('<','<=','≤','is','='):\n\
          \            contract_max=n\n    if st=='AS' and budget_max is not None\
          \ and speed_min is not None:\n        profile='AS_BUDGET_SPEED'\n    elif\
