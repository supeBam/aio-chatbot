    - data:
        code: "import re\nimport json\nimport html\n\ndef safe(x): return \"\" if\
          \ x is None else str(x)\n\ndef normalize_list(x):\n    if isinstance(x,\
          \ str):\n        try: return json.loads(x)\n        except Exception: return\
          \ []\n    return x or []\n\ndef simplify_item(item):\n    if not isinstance(item,\
          \ dict):\n        return {}\n    pid=safe(item.get('project_id') or item.get('product_id'))\n\
          \    return {\n        'index': item.get('index'),\n        'project_id':\
          \ pid,\n        'product_id': pid,\n        'title': safe(item.get('metadata_title')\
          \ or item.get('title')),\n        'metadata_title': safe(item.get('metadata_title')\
          \ or item.get('title')),\n        'document_name': safe(item.get('document_name')),\n\
          \        'service_type': safe(item.get('service_type')),\n        'monthly_fee':\
          \ item.get('monthly_fee',''),\n        'contract_month': item.get('contract_month',''),\n\
          \        'local_data': item.get('local_data',''),\n        'content_excerpt':\
          \ safe(item.get('content_excerpt')),\n    }\n\ndef marker_index(text):\n\
          \    t = str(text or '')\n    for _ in range(3):\n        nt = html.unescape(t)\n\
          \        if nt == t: break\n        t = nt\n    m = re.findall(r\"\\[\\\
          [\\s*SELECTED_INDEX\\s*[:：]\\s*(\\d*)\\s*\\]\\]\", t, flags=re.I)\n    if\
          \ not m: return 0\n    try: return int(m[-1]) if m[-1].strip() else 0\n\
          \    except Exception: return 0\n\ndef json_obj(text):\n    t = str(text\
          \ or '').strip()\n    t = re.sub(r'^```(?:json)?\\s*', '', t, flags=re.I).strip()\n\
          \    t = re.sub(r'\\s*```$', '', t).strip()\n    try:\n        o=json.loads(t)\n\
          \        return o if isinstance(o,dict) else {}\n    except Exception:\n\
          \        s=t.find('{'); e=t.rfind('}')\n        if s>=0 and e>s:\n     \
          \       try:\n                o=json.loads(t[s:e+1])\n                return\
          \ o if isinstance(o,dict) else {}\n            except Exception: return\
          \ {}\n    return {}\n\ndef selector_index(selector_text, valid):\n    o=json_obj(selector_text)\n\
          \    if not o: return 0, 'selector_invalid_json'\n    try: idx=int(o.get('selected_index')\
          \ or 0)\n    except Exception: idx=0\n    if idx <= 0: return 0, 'selector_empty'\n\
          \    if idx not in valid: return 0, 'selector_not_in_index_map'\n    return\
          \ idx, 'selector_contract'\n\ndef main(llm_text: str, index_map=None, route_action:\
          \ str = '', selector_text: str = ''):\n    index_map=normalize_list(index_map)\n\
          \    valid=set()\n    for it in index_map:\n        try: valid.add(int(it.get('index',0)))\n\
          \        except Exception: pass\n    idx, source = selector_index(selector_text,\
          \ valid)\n    if not idx:\n        idx = marker_index(llm_text)\n      \
          \  if idx: source = 'fallback_llm_marker'\n    selected=None\n    for it\
          \ in index_map:\n        try:\n            if int(it.get('index',0)) ==\
          \ idx:\n                selected=it; break\n        except Exception: pass\n\
          \    selected_product=simplify_item(selected or {})\n    action=safe(route_action).upper()\n\
          \    if action == 'COMPARE_PRODUCTS':\n        selected_products=[]; seen=set()\n\
          \        for it in index_map:\n            obj=simplify_item(it); pid=safe(obj.get('project_id')\
          \ or obj.get('product_id'))\n            if pid and pid not in seen:\n \
          \               selected_products.append(obj); seen.add(pid)\n    else:\n\
          \        selected_products=[selected_product] if selected_product.get('project_id')\
          \ or selected_product.get('product_id') else []\n    product_ids=','.join([safe(x.get('project_id')\
          \ or x.get('product_id')) for x in selected_products if safe(x.get('project_id')\
          \ or x.get('product_id'))])\n    return {'selected_index': idx, 'selection_source':\
          \ source, 'product_id': safe(selected_product.get('product_id') or selected_product.get('project_id')),\
          \ 'service_type': safe(selected_product.get('service_type')), 'selected_product':\
          \ selected_product, 'selected_products': selected_products, 'product_ids':\
          \ product_ids}\n"
