          s*(-?\\d+(?:\\.\\d+)?)',bm.get(idx,''))\n        semantic=float(m.group(1))\
          \ if m else 0.0; breakdown['semantic']=round(semantic,4); total+=semantic*10\n\
          \        fee=num(item.get('monthly_fee')); speed=num(item.get('broadband_speed_mbps'));\
