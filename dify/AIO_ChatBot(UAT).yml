    - data:
        code: "import json, re\n\ndef s(x): return '' if x is None else str(x)\ndef\
          \ as_list(x):\n    if isinstance(x,list): return x\n    if isinstance(x,str):\n\
          \        try:\n            v=json.loads(x); return v if isinstance(v,list)\
          \ else []\n        except Exception:return []\n    return []\ndef parse_obj(raw):\n\
          \    if isinstance(raw,dict): return raw\n    try:\n        v=json.loads(s(raw));\
          \ return v if isinstance(v,dict) else {}\n    except Exception:return {}\n\
          def num(x):\n    if isinstance(x,(int,float)): return float(x)\n    m=re.search(r'-?\\\
          d+(?:\\.\\d+)?',s(x).replace(',',''))\n    return float(m.group()) if m\
          \ else None\ndef norm_op(x):\n    op=s(x).strip().lower()\n    return {'is':'=','equals':'='}.get(op,op)\n\
          def cmp(actual,op,target):\n    if actual is None or target is None:return\
          \ None\n    a=float(actual); b=float(target); op=norm_op(op)\n    if op=='=':return\
          \ abs(a-b)<0.001\n    if op=='<=':return a<=b\n    if op=='>=':return a>=b\n\
          \    if op=='<':return a<b\n    if op=='>':return a>b\n    return None\n\
          def block_map(text):\n    out={}\n    for m in re.finditer(r'(?ms)^\\[INDEX\\\
          s+(\\d+)\\]\\s*(.*?)(?=^\\[INDEX\\s+\\d+\\]|\\Z)',s(text)):\n        out[int(m.group(1))]=m.group(0).strip()\n\
          \    return out\ndef constraints(raw):\n    obj=parse_obj(raw); cs=obj.get('constraints',[])\
          \ if isinstance(obj,dict) else []\n    return [x for x in cs if isinstance(x,dict)]\n\
          def value(c):\n    return c.get('normalized_value') if c.get('normalized_value')\
          \ not in (None,'') else c.get('value')\ndef addon_terms(v):\n    vals=v\
          \ if isinstance(v,list) else [v]\n    aliases=[]\n    for z in vals:\n \
          \       q=s(z).lower().strip()\n        if not q:continue\n        aliases.append(q)\n\
          \        if 'disney' in q: aliases.extend(['disney+','disney plus'])\n \
          \       if 'iqiyi' in q or '愛奇藝' in q or '爱奇艺' in q: aliases.extend(['iqiyi','愛奇藝','爱奇艺'])\n\
          \    return list(dict.fromkeys(aliases))\ndef main(products_for_llm='',\
          \ index_map=None, active_constraints_json='', service_type='', excluded_product_ids=''):\n\
          \    arr=as_list(index_map); blocks=block_map(products_for_llm); cs=constraints(active_constraints_json)\n\
          \    excluded=set(re.split(r'[,，;；\\s]+',s(excluded_product_ids).strip()))-{''}\n\
          \    kept=[]; rejected=[]\n    for item in arr:\n        try: old_idx=int(item.get('index',0))\n\
          \        except Exception: continue\n        pid=s(item.get('project_id')\
          \ or item.get('product_id')).strip()\n        text=(s(item.get('title'))+'\\\
          n'+s(item.get('content_excerpt'))+'\\n'+blocks.get(old_idx,'')).lower()\n\
          \        failures=[]; unknown=[]\n        if pid and pid in excluded: failures.append('excluded_product')\n\
          \        item_service=s(item.get('service_type')).upper()\n        if service_type\
          \ and item_service and item_service!=s(service_type).upper(): failures.append('service_type')\n\
          \        for c in cs:\n            if s(c.get('priority')).lower()!='hard':\
          \ continue\n            slot=s(c.get('slot')).lower(); op=s(c.get('operator')\
          \ or 'is'); target=value(c); result=None; reason=slot\n            if slot\
          \ in ('price','monthly_fee','budget'):\n                result=cmp(num(item.get('monthly_fee')),op,num(target));\
          \ reason='budget'\n            elif slot in ('speed','broadband_speed','bandwidth'):\n\
          \                t=num(target); raw=s(target).lower()+s(c.get('unit')).lower()\n\
          \                if t is not None and t<=10 and ('g' in raw or 'gbps' in\
          \ raw): t*=1000\n                result=cmp(num(item.get('broadband_speed_mbps')),op,t);\
          \ reason='speed'\n            elif slot in ('data_allowance','mobile_data','local_data','data'):\n\
          \                result=cmp(num(item.get('local_data')),op,num(target));\
          \ reason='data_allowance'\n            elif slot in ('contract','contract_month','duration'):\n\
          \                result=cmp(num(item.get('contract_month')),op,num(target));\
          \ reason='contract'\n            elif slot=='addon':\n                result=None;\
          \ reason='addon_semantic_by_llm'  # semantic evidence is decided by LLM\
          \ Judge\n            elif slot=='service_type':\n                result=(item_service==s(target).upper());\
          \ reason='service_type'\n            else:\n                unknown.append(slot);\
          \ continue\n            if result is False: failures.append(reason)\n  \
          \          elif result is None: unknown.append(reason)\n        if failures:\n\
          \            rejected.append({'project_id':pid,'old_index':old_idx,'failed_hard_constraints':list(dict.fromkeys(failures))})\n\
          \            continue\n        obj=dict(item); obj['old_index']=old_idx;\
          \ obj['hard_unknown_constraints']=list(dict.fromkeys(unknown)); kept.append(obj)\n\
          \    new_blocks=[]; new_map=[]\n    for i,item in enumerate(kept,1):\n \
          \       old=item.get('old_index'); b=blocks.get(old,'')\n        b=re.sub(r'^\\\
          [INDEX\\s+\\d+\\]',f'[INDEX {i}]',b,count=1)\n        item['index']=i; new_map.append(item);\
          \ new_blocks.append(b)\n    return {'products_for_llm':'\\n\\n'.join(new_blocks),'index_map':new_map,'total':len(new_map),'rejected_products':rejected,'rejected_count':len(rejected),'filter_status':'OK'\
          \ if new_map else 'NO_HARD_MATCH'}\n"
        code_language: python3
        outputs:
