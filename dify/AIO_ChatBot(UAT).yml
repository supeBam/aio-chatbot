        code: "import re, json\n\ndef s(x): return '' if x is None else str(x)\ndef\
          \ low(x): return s(x).lower()\ndef has(t, words):\n    q=low(t); return\
          \ any(w in q for w in words)\ndef add_constraint(cs,slot,op,value,normalized,unit,priority='hard'):\n\
          \    cs.append({'slot':slot,'operator':op,'value':value,'normalized_value':normalized,'unit':unit,'priority':priority,'carry_policy':'carry_until_user_changes'\
          \ if priority=='hard' else 'current_turn_only','source':'current_user_query','confidence':1.0\
          \ if priority=='hard' else 0.9})\n\ndef main(user_query: str='', active_service_type:\
          \ str='', active_constraints_json: str='', last_route_action: str=''):\n\
          \    q=s(user_query).strip(); ql=low(q)\n    as_hit=has(q,['寬頻','宽频','broadband','家居上網','家居上网','光纖','光纤','wi-fi','wifi'])\
          \ or bool(re.search(r'\\b(?:\\d+(?:\\.\\d+)?\\s*(?:g|gbps|m|mbps))\\s*(?:寬頻|宽频)',ql))\n\
          \    ms_hit=has(q,['手機月費','手机月费','流動數據','流动数据','mobile plan','sim卡','sim\
          \ 卡','esim'])\n    xe_hit=has(q,['外遊數據','外游数据','roaming plan','netflix plan','disney+\
          \ plan'])\n    hits=[x for x,b in [('AS',as_hit),('MS',ms_hit),('XE',xe_hit)]\
          \ if b]\n    svc=hits[0] if len(hits)==1 else 'UNKNOWN'\n    references=['上次','上一個','上一个','第二個','第二个','第三個','第三个','剛才','刚才','呢個','这个','這個','比較','比较','詳情','详情','仲有','再來','再来','同頭先','同头先']\n\
          \    conditionals=['但','不過','不过','除非','如果','否則','否则','同時','同时','優先','优先','其次','寧願','宁愿','可以貴','可以贵','差唔多價','差不多价','視乎','视乎','相近價']\n\
          \    semantic=['最好有','如果有','必須有','必须有','連埋','连埋','bundle','分別','分别','適合一家','适合一家','打機','游戏','睇片','追劇','追剧','穩定','稳定','低延遲','低延迟','性價比','性价比','路由器','短約','短约','自由約','自由约','越短越好']\n\
          \    switches=['改問','改问','轉去','转去','不要寬頻','不要宽频','唔要寬頻','唔要宽频','其實想','其实想']\n\
          \    has_reference=has(q,references); has_conditional=has(q,conditionals);\
          \ has_semantic=has(q,semantic); explicit_switch=has(q,switches)\n    constraints=[];\
          \ parsed_slots=[]; parsed_numbers=[]\n    speed=None\n    sm=re.search(r'(?<!\\\
          d)(\\d+(?:\\.\\d+)?)\\s*(gbps|mbps|g|m)(?![a-z0-9])',ql)\n    has_explicit_min_speed=has(q,['至少','或以上','以上速度','起碼','起码','不低於','不低于','minimum','at\
          \ least'])\n    has_explicit_max_speed=has(q,['最多','或以下','不高於','不高于','不超過','不超过','maximum','at\
          \ most'])\n    if sm:\n        speed=float(sm.group(1))*(1000 if sm.group(2)\
          \ in ('g','gbps') else 1)\n        speed_value=int(speed) if speed.is_integer()\
          \ else speed\n        # Keep faster plans eligible, but ordinary wording\
          \ such as \"需要1G\"\n        # records 1G as the preferred target. Explicit\
          \ min/max wording is respected.\n        speed_op='<=' if has_explicit_max_speed\
          \ else '>='\n        add_constraint(constraints,'speed',speed_op,sm.group(0),speed_value,'Mbps')\n\
          \        if not has_explicit_min_speed and not has_explicit_max_speed:\n\
          \            add_constraint(constraints,'target_speed','is',sm.group(0),speed_value,'Mbps','preference')\n\
          \        parsed_slots.append('speed'); parsed_numbers.append(float(sm.group(1)))\n\
          \    data=None\n    dm=re.search(r'(?<!\\d)(\\d+(?:\\.\\d+)?)\\s*(gb)(?![a-z0-9])',ql)\n\
          \    if dm and svc=='MS':\n        data=float(dm.group(1)); add_constraint(constraints,'data_allowance','>=',dm.group(0),int(data)\
          \ if data.is_integer() else data,'GB'); parsed_slots.append('data_allowance');\
          \ parsed_numbers.append(data)\n    contract=None\n    cm=re.search(r'(\\\
          d+(?:\\.\\d+)?)\\s*(?:個月|个月|月)\\s*(?:以內|以内|以下|或以下|最長|最长)',ql)\n    if cm:\n\
          \        contract=float(cm.group(1)); add_constraint(constraints,'contract','<=',cm.group(0),int(contract)\
          \ if contract.is_integer() else contract,'month'); parsed_slots.append('contract');\
          \ parsed_numbers.append(contract)\n    prices=[float(x) for x in re.findall(r'\\\
          $\\s*(\\d+(?:\\.\\d+)?)',q)]\n    cap=None; cheaper=has(q,['有冇得平','有沒有更便宜','有没有更便宜','平過','平过','便宜過','便宜过','低過','低于','低於'])\n\
          \    if prices and cheaper: cap=min(prices)\n    if cap is None:\n     \
          \   pm=re.search(r'\\$?\\s*(\\d+(?:\\.\\d+)?)\\s*(?:蚊|元|hkd|港幣|港币)?\\s*(?:以下|以內|以内|不超過|不超过)',ql)\n\
          \        if pm: cap=float(pm.group(1))\n    if cap is not None:\n      \
          \  add_constraint(constraints,'price','<' if cheaper else '<=',cap,cap,'HKD');\
          \ parsed_slots.append('price'); parsed_numbers.append(cap)\n    # High-precision\
          \ whitelist: explicit service + at least one executable numeric constraint.\n\
          \    has_numeric_constraint=bool([x for x in parsed_slots if x in ('speed','data_allowance','contract','price')])\n\
          \    all_numbers=[float(x) for x in re.findall(r'(?<![a-z])(?<!\\d)(\\d+(?:\\\
          .\\d+)?)',ql)]\n    unmatched_numbers=[]\n    for n in all_numbers:\n  \
          \      if not any(abs(n-p)<0.001 for p in parsed_numbers): unmatched_numbers.append(n)\n\
          \    # If any meaningful grammar remains unsupported, route to LLM. This\
          \ intentionally favors precision over Fast Path recall.\n    too_long=len(q)>100\n\
          \    confidence=1.0\n    reasons=[]\n    for flag,name,penalty in [(svc=='UNKNOWN','service_ambiguous',1.0),(not\
          \ has_numeric_constraint,'no_supported_numeric_constraint',1.0),(has_reference,'context_reference',1.0),(has_conditional,'conditional_logic',1.0),(has_semantic,'semantic_preference',1.0),(explicit_switch,'service_switch',1.0),(bool(unmatched_numbers),'unparsed_number',0.5),(too_long,'query_too_long',0.5)]:\n\
          \        if flag: confidence-=penalty; reasons.append(name)\n    confidence=max(0.0,min(1.0,confidence))\n\
          \    coverage=1.0 if svc!='UNKNOWN' and has_numeric_constraint and not unmatched_numbers\
          \ else (0.8 if svc!='UNKNOWN' and has_numeric_constraint else 0.0)\n   \
          \ can_fast=confidence>=0.95 and coverage>=0.95\n    obj={'schema_version':'1.0','service_type':svc,'constraints':constraints,'negative_constraints':[],'preference_order':((['target_speed_distance']\
          \ if speed is not None and not has_explicit_min_speed and not has_explicit_max_speed\
          \ else []) + (['monthly_fee'] if cap is not None or cheaper else []) + (['contract_month']\
          \ if svc=='AS' else []))}\n    decision={'route_action':'NEW_SEARCH','service_type':svc,'effective_query':q,'active_user_need':q,'active_constraints_json':json.dumps(obj,ensure_ascii=False,separators=(',',':')),'followup_type':'budget_cap'\
          \ if cap is not None else 'none','target_product_ids':'','compare_product_ids':'','exclude_product_ids':'','should_exclude_last_product':False,'needs_retrieval':True,'needs_clarification':False,'confidence':'high','reason':'deterministic_high_precision'}\n\
          \    return {'use_fast_context':bool(can_fast),'resolver_text':json.dumps(decision,ensure_ascii=False,separators=(',',':')),'fast_confidence':confidence,'parsed_coverage':coverage,'has_unparsed_semantics':bool(has_conditional\
          \ or has_semantic or unmatched_numbers),'fallback_reason':','.join(reasons),'debug':f'fast={can_fast};\
          \ svc={svc}; slots={parsed_slots}; confidence={confidence}; coverage={coverage};\
          \ reasons={reasons}'}\n"
