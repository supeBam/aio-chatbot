          \ str(x)\n\ndef normalize_list(x):\n    if isinstance(x, str):\n       \
          \ try: return json.loads(x)\n        except Exception: return []\n    return\
          \ x or []\n\ndef parse_selector(text):\n    t = safe(text).strip()\n   \
          \ t = re.sub(r'^```(?:json)?\\s*', '', t, flags=re.I).strip()\n    t = re.sub(r'\\\
          s*```$', '', t).strip()\n    try:\n        obj = json.loads(t)\n       \
          \ return obj if isinstance(obj, dict) else {}\n    except Exception:\n \
          \       s = t.find('{'); e = t.rfind('}')\n        if s >= 0 and e > s:\n\
          \            try:\n                obj = json.loads(t[s:e+1])\n        \
          \        return obj if isinstance(obj, dict) else {}\n            except\
          \ Exception:\n                return {}\n    return {}\n\ndef int_list(vals):\n\
          \    out=[]\n    if not isinstance(vals, list):\n        return out\n  \
          \  for v in vals:\n        try:\n            i=int(v)\n            if i>0\
          \ and i not in out:\n                out.append(i)\n        except Exception:\n\
          \            pass\n    return out\n\ndef choose_indices(contract):\n   \
          \ mode = safe(contract.get('render_mode') or 'SINGLE_RECOMMEND').upper()\n\
          \    try:\n        selected = int(contract.get('selected_index') or 0)\n\
          \    except Exception:\n        selected = 0\n    display = int_list(contract.get('display_indices'))\n\
          \    if mode == 'NO_VALID_PRODUCT' or selected <= 0:\n        return [],\
          \ selected, mode\n    if mode == 'SINGLE_RECOMMEND' or mode == 'PRODUCT_DETAIL':\n\
          \        return [selected], selected, mode\n    if mode == 'COMPARE_PRODUCTS':\n\
          \        if selected not in display:\n            display = [selected] +\
          \ display\n        return display, selected, mode\n    return [selected],\
          \ selected, mode\n\ndef split_blocks(products_text):\n    text = safe(products_text)\n\
          \    blocks = []\n    # Capture each [INDEX n] block until next [INDEX]\
          \ or end.\n    for m in re.finditer(r'(\\[INDEX\\s+(\\d+)\\][\\s\\S]*?)(?=\\\
          n\\[INDEX\\s+\\d+\\]|\\Z)', text):\n        try:\n            idx = int(m.group(2))\n\
          \        except Exception:\n            continue\n        blocks.append((idx,\
          \ m.group(1).strip()))\n    return blocks\n\ndef main(selector_text: str\
          \ = '', products_for_llm: str = '', index_map=None):\n    contract = parse_selector(selector_text)\n\
          \    display_indices, selected_index, render_mode = choose_indices(contract)\n\
          \    wanted = set(display_indices)\n    blocks = split_blocks(products_for_llm)\n\
          \    filtered_blocks = [b for idx,b in blocks if idx in wanted]\n    index_map\
          \ = normalize_list(index_map)\n    filtered_map = []\n    for item in index_map:\n\
          \        try:\n            if int(item.get('index',0)) in wanted:\n    \
          \            filtered_map.append(item)\n        except Exception:\n    \
          \        pass\n    header = f\"【FILTERED_CANDIDATES】render_mode={render_mode};\
          \ selected_index={selected_index}; display_indices={','.join(map(str, display_indices))}\\\
          n\"\n    return {\n        'products_for_llm': header + ('\\n\\n'.join(filtered_blocks)\
          \ if filtered_blocks else ''),\n        'index_map': filtered_map,\n   \
          \     'selected_index': selected_index,\n        'display_indices': display_indices,\n\
          \        'render_mode': render_mode,\n        'selection_status': safe(contract.get('selection_status')),\n\
          \        'reason': safe(contract.get('reason')),\n        'gap_explanation':\
          \ safe(contract.get('gap_explanation')),\n    }\n"
